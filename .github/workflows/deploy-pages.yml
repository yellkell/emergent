name: Deploy Papercraft Desert to Pages

# Builds the IWSDK WebXR scene in papercraft-desert/ and publishes the static
# bundle to GitHub Pages. The hosted build includes the IWER emulator, so the
# demo is explorable on desktop (mouse/keyboard) while a real headset gets VR.

on:
  push:
    branches:
      - claude/inspiring-hamilton-djumf0
      - main
    paths:
      - 'papercraft-desert/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papercraft-desert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: papercraft-desert/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
      # Requires Pages to be enabled once in the repo: Settings → Pages →
      # Build and deployment → Source: "GitHub Actions". (The Actions token
      # cannot create the Pages site itself on a user repo.)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: papercraft-desert/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
